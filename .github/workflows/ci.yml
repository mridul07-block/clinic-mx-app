# FND-01: checks every pull request and every push to main.
# Actions are pinned to commit SHAs (version in the comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the forward only check can find where the branch started.
          fetch-depth: 0

      # pnpm first, so setup-node can cache the pnpm store. The version comes from
      # "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # FND-06: no raw colours, no gold text, no Tailwind default palette, no dynamic class
      # names, and every token pair at WCAG contrast (Frontend Specification section 10).
      - name: Design token check
        run: pnpm check:design

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # FND-04: every schema change ships with its generated migration.
      - name: Check migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- supabase/migrations)" ]; then
            git status --short -- supabase/migrations
            echo "::error::The schema changed without a migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

      # Rule 18: migrations are forward only. A merged migration is never edited, renamed or deleted.
      - name: Check migrations are forward only
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF...HEAD" \
            -- 'supabase/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Existing migrations changed. Add a new migration instead."
            exit 1
          fi

  # IAM-01: the app signs in against the local Supabase stack; the seed gives the test staff
  # logins with a password made for this run.
  e2e:
    name: End to end (360 px phone and desktop)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CLINIC_MX_SEED_TARGET: local
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start local Supabase
        run: pnpm db:start

      # The local stack's URL and its fixed demo keys (not secrets), and a fresh staff password.
      - name: Point the app and the seed at local Supabase
        run: |
          pnpm --silent exec supabase status -o env | tr -d '"' | sed -n \
            -e 's/^API_URL=/SUPABASE_URL=/p' \
            -e 's/^ANON_KEY=/SUPABASE_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' \
            -e 's/^MAILPIT_URL=/MAILPIT_URL=/p' >> "$GITHUB_ENV"
          echo "CLINIC_MX_SEED_STAFF_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Seed with staff logins
        run: pnpm db:seed

      # Playwright builds the app and runs `next start` (playwright.config.ts webServer).
      - name: End to end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: ${{ always() }}
        run: pnpm db:stop --no-backup

  # FND-03: the local Supabase stack from supabase/config.toml. It runs here rather than on
  # developer machines. FND-04 applies the migrations, seeds and runs the database tests;
  # IAM-05 adds the row level security tests per role.
  supabase:
    name: Local Supabase stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CLINIC_MX_SEED_TARGET: local
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Applies every migration in supabase/migrations to an empty database.
      - name: Start local Supabase
        run: pnpm db:start

      - name: Check Postgres answers with the staging major version
        run: |
          pnpm db:status
          major=$(psql "$DIRECT_DATABASE_URL" -tAc \
            "select current_setting('server_version_num')::int / 10000")
          echo "local Postgres major version: $major"
          test "$major" = "17"

      - name: Seed
        run: pnpm db:seed

      - name: Database tests
        run: pnpm --filter @clinic-mx/db test:integration

      - name: Stop local Supabase
        if: ${{ always() }}
        run: pnpm db:stop --no-backup

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks release binary, checked against a hash pinned here (rule 13).
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan git history for secrets
        run: ./gitleaks git . --redact --verbose --no-banner --exit-code 1
