# Starts the local Supabase stack (pnpm db:start). Its Docker images (about 2 GB) come from the
# Actions cache when the pinned Supabase CLI and supabase/config.toml are unchanged, instead of
# being pulled on every run: faster, and a slow image registry no longer slows CI. On a miss the
# images are pulled as before and kept for the next run. The stack itself is the same either way.
name: Start local Supabase
description: Starts the local Supabase stack, its images restored from the Actions cache.
runs:
  using: composite
  steps:
    - name: Find the Supabase CLI version
      id: cli
      shell: bash
      run: echo "version=$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_OUTPUT"

    - name: Restore the Supabase images
      id: images
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/supabase-images.tar
        key: supabase-images-${{ runner.os }}-${{ steps.cli.outputs.version }}-${{ hashFiles('supabase/config.toml') }}

    - name: Load the Supabase images
      if: steps.images.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -q -i /tmp/supabase-images.tar && rm /tmp/supabase-images.tar

    - name: Start local Supabase
      shell: bash
      run: pnpm db:start

    - name: Keep the Supabase images for the next run
      if: steps.images.outputs.cache-hit != 'true'
      shell: bash
      run: docker save -o /tmp/supabase-images.tar $(docker ps --format '{{.Image}}' | sort -u)

    - name: Save the Supabase images
      if: steps.images.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/supabase-images.tar
        key: supabase-images-${{ runner.os }}-${{ steps.cli.outputs.version }}-${{ hashFiles('supabase/config.toml') }}
